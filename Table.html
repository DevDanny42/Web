<!DOCTYPE html>
<html>
<head>
   <title>Multiplication Table</title>
</head>
<body>
   <h2>Multiplication Table</h2>
   <button onclick="multiplicationTable()">
       Display Table
   </button>
   <script>
       function multiplicationTable() {
           let n = Number(prompt("Enter a number:"));
           if (isNaN(n)) {
               alert("Please enter a valid number.");
               return;
           }
           let table = "";
           for (let i = 1; i <= 10; i++) {

               table += n + " × " + i +
                        " = " + (n * i) + "\n";
           }
           alert(table);
       }
   </script>
</body>
</html>
