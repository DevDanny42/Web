<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Functions</title>
</head>

<body>

    <h2>JavaScript Function Demonstration</h2>

    <label>Enter First Number:</label>
    <input type="number" id="num1">

    <br><br>

    <label>Enter Second Number:</label>
    <input type="number" id="num2">

    <br><br>

    <button onclick="calculate()">Calculate</button>

    <h3 id="result"></h3>

    <script>

        // Anonymous function for addition
        let add = function(a, b) {
            return a + b;
        };

        // Arrow function for multiplication
        let multiply = (a, b) => a * b;

        function calculate() {

            let number1 = Number(document.getElementById("num1").value);
            let number2 = Number(document.getElementById("num2").value);

            let sum = add(number1, number2);
            let product = multiply(number1, number2);

            document.getElementById("result").innerHTML =
                "Addition = " + sum + "<br>" +
                "Multiplication = " + product;
        }

    </script>

</body>
</html>
